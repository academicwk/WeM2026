<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลการพิจารณาเลื่อนเงินเดือน | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none">ผลการพิจารณาเลื่อนเงินเดือน</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5">ระบบแจ้งผลการพิจารณาเป็นรายบุคคล</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto bg-slate-50 relative">
            <div id="admin-actions" class="max-w-5xl mx-auto mb-6 flex justify-end hidden">
                <button onclick="openSalaryModal()" class="w-full sm:w-auto bg-navy-900 hover:bg-navy-800 text-white py-2.5 px-6 rounded-xl font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> เพิ่มข้อมูลการเลื่อนเงินเดือน
                </button>
            </div>

            <div id="salary-cards-container" class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-10"></div>
        </div>
    </main>

    <div id="salaryModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <button onclick="closeSalaryModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-lg font-bold text-navy-900 mb-4 border-b pb-2" id="modal-title"><i class="fa-solid fa-file-invoice-dollar text-gold-500 mr-2"></i>เพิ่มข้อมูลผลการพิจารณา</h3>
            
            <input type="hidden" id="modal-id">
            <input type="hidden" id="modal-existing-pdf">
            
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-bold text-gray-700 mb-1 block">ชื่อ-สกุล ผู้รับการประเมิน <span class="text-red-500">*</span></label>
                    <select id="modal-user" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-navy-800 bg-slate-50">
                        <option value="">-- กำลังโหลดรายชื่อ --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-bold text-gray-700 mb-1 block">ครั้งที่ <span class="text-red-500">*</span></label>
                        <select id="modal-term" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-navy-800 bg-slate-50">
                            <option value="ครึ่งปีแรก">ครึ่งปีแรก</option>
                            <option value="ครึ่งปีหลัง">ครึ่งปีหลัง</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-gray-700 mb-1 block">ปีงบประมาณ พ.ศ. <span class="text-red-500">*</span></label>
                        <input type="number" id="modal-year" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-navy-800" value="2569">
                    </div>
                </div>
                <div>
                    <label class="text-sm font-bold text-gray-700 mb-1 block">อัปโหลดไฟล์ PDF ผลการพิจารณา</label>
                    <input type="file" id="modal-file" accept="application/pdf" class="w-full border border-gray-300 p-2 rounded-lg text-sm bg-slate-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-navy-50 file:text-navy-700 hover:file:bg-navy-100 cursor-pointer">
                    <p class="text-xs text-gray-500 mt-1" id="file-status-text">กรณีแก้ไข หากไม่ต้องการเปลี่ยนไฟล์ใหม่ ไม่ต้องเลือกไฟล์</p>
                </div>
            </div>
            
            <button onclick="submitSalaryData()" class="w-full mt-6 bg-gold-500 hover:bg-gold-400 text-navy-900 py-3 rounded-xl font-bold shadow-md transition-colors">
                <i class="fa-solid fa-save mr-2"></i> บันทึกข้อมูล
            </button>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec"; // ⚠️ เปลี่ยนเป็นลิงก์ API ของคุณครู

        let currentUser = null;
        let allUsers = []; 
        let salaryDataList = [];
        const ADMIN_NAME = "นายพีระศิน ไชยศร";

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                document.getElementById('sidebar-container').innerHTML = await response.text();
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userData);

            // เช็คสิทธิ์ Admin
            if (currentUser.name === ADMIN_NAME) {
                document.getElementById('admin-actions').classList.remove('hidden');
            }

            setInterval(() => {
                const now = new Date();
                const clockEl = document.getElementById('current-date');
                if (clockEl) clockEl.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
            if (currentUser.name === ADMIN_NAME) { await fetchAllUsers(); } // โหลดรายชื่อเฉพาะ Admin
            fetchSalaryData();
        });

        async function fetchAllUsers() {
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllUsers' }) }).then(r => r.json());
                if(res.status === 'success') { 
                    allUsers = res.users;
                    const select = document.getElementById('modal-user');
                    select.innerHTML = '<option value="">-- เลือกผู้รับการประเมิน --</option>';
                    allUsers.forEach(u => {
                        if(u.Name && u.Name !== "Name") {
                            select.innerHTML += `<option value="${u.Name}">${u.Name}</option>`;
                        }
                    });
                }
            } catch (err) {}
        }

        async function fetchSalaryData() {
            const container = document.getElementById('salary-cards-container');
            container.innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-navy-800"></i></div>`;
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getSalaryReview' }) }).then(r => r.json());
                if (res.status === 'success') {
                    salaryDataList = res.data || [];
                    renderCards();
                } else { container.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">ไม่สามารถโหลดข้อมูลได้</div>`; }
            } catch (error) { container.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">การเชื่อมต่อผิดพลาด</div>`; }
        }

        function renderCards() {
            const container = document.getElementById('salary-cards-container');
            container.innerHTML = '';
            const isAdmin = currentUser.name === ADMIN_NAME;

            // กรองข้อมูล: ถ้าเป็น Admin เห็นหมด, ถ้าเป็นครู เห็นเฉพาะของตัวเอง
            const viewData = isAdmin ? salaryDataList : salaryDataList.filter(d => d.name === currentUser.name);

            if (viewData.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-2xl shadow-sm border border-gray-200 text-center"><i class="fa-solid fa-folder-open text-5xl text-gray-300 mb-3"></i><p class="text-gray-500 font-medium">ยังไม่มีผลการพิจารณาเงินเดือนของคุณ</p></div>`;
                return;
            }

            viewData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col relative overflow-hidden group hover:shadow-md transition-all";
                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-500"></div>
                    <div class="flex items-start justify-between mb-3 ml-2">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                            <div>
                                <h4 class="font-bold text-navy-900 text-sm md:text-base leading-tight">${item.name}</h4>
                                <p class="text-xs text-gray-500 mt-0.5">ผลการพิจารณา</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-4 ml-2">
                        <p class="text-[11px] font-bold text-gray-600"><i class="fa-regular fa-calendar text-gold-500 mr-1.5"></i> ${item.term} / ปีงบฯ ${item.year}</p>
                    </div>
                    <div class="mt-auto flex gap-2 ml-2">
                        <a href="${item.pdfUrl || '#'}" target="_blank" class="flex-1 bg-navy-900 hover:bg-navy-800 text-white text-xs font-bold py-2 rounded-lg flex justify-center items-center gap-1.5 transition-colors shadow-sm ${!item.pdfUrl ? 'opacity-50 pointer-events-none' : ''}">
                            <i class="fa-solid fa-file-pdf"></i> ดูผลการพิจารณา
                        </a>
                        ${isAdmin ? `
                        <button onclick="openSalaryModal('${item.id}')" class="w-9 h-9 bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-200 rounded-lg flex justify-center items-center transition-colors"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteSalaryData('${item.id}')" class="w-9 h-9 bg-red-50 hover:bg-red-100 text-red-500 border border-red-200 rounded-lg flex justify-center items-center transition-colors"><i class="fa-solid fa-trash"></i></button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSalaryModal(id = null) {
            if (id) {
                const data = salaryDataList.find(r => String(r.id) === String(id));
                if (data) {
                    document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-gold-500 mr-2"></i>แก้ไขข้อมูล`;
                    document.getElementById('modal-id').value = data.id;
                    document.getElementById('modal-user').value = data.name;
                    document.getElementById('modal-term').value = data.term;
                    document.getElementById('modal-year').value = data.year;
                    document.getElementById('modal-existing-pdf').value = data.pdfUrl;
                    document.getElementById('modal-file').value = "";
                }
            } else {
                document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-file-invoice-dollar text-gold-500 mr-2"></i>เพิ่มข้อมูลผลการพิจารณา`;
                document.getElementById('modal-id').value = "";
                document.getElementById('modal-user').value = "";
                document.getElementById('modal-term').value = "ครึ่งปีแรก";
                document.getElementById('modal-year').value = "2569";
                document.getElementById('modal-existing-pdf').value = "";
                document.getElementById('modal-file').value = "";
            }
            document.getElementById('salaryModal').classList.remove('hidden');
        }

        function closeSalaryModal() { document.getElementById('salaryModal').classList.add('hidden'); }

        async function submitSalaryData() {
            const payload = {
                action: 'saveSalaryReview',
                id: document.getElementById('modal-id').value,
                name: document.getElementById('modal-user').value,
                term: document.getElementById('modal-term').value,
                year: document.getElementById('modal-year').value,
                existingPdfUrl: document.getElementById('modal-existing-pdf').value
            };

            if(!payload.name || !payload.term || !payload.year) {
                Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกชื่อ ครั้งที่ และระบุปีงบประมาณ', 'warning'); return;
            }

            const fileInput = document.getElementById('modal-file');
            if(fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if(file.type !== "application/pdf") { Swal.fire('ไฟล์ไม่ถูกต้อง', 'กรุณาอัปโหลดไฟล์ PDF เท่านั้น', 'warning'); return; }
                if(file.size > 5 * 1024 * 1024) { Swal.fire('ไฟล์ใหญ่เกินไป', 'ขนาดไฟล์ต้องไม่เกิน 5MB', 'warning'); return; }
                
                payload.fileName = file.name;
                payload.fileMimeType = file.type;
                payload.fileBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            } else if (!payload.id) { // ถ้าเพิ่มใหม่ ต้องบังคับแนบไฟล์
                Swal.fire('ลืมแนบไฟล์', 'กรุณาอัปโหลดไฟล์ผลการพิจารณา (PDF)', 'warning'); return;
            }

            Swal.fire({ title: 'กำลังบันทึกและอัปโหลดไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
                if (res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
                    closeSalaryModal();
                    fetchSalaryData();
                } else { Swal.fire('ผิดพลาด', res.message, 'error'); }
            } catch (error) { Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'); }
        }

        function deleteSalaryData(id) {
            Swal.fire({
                title: 'ลบข้อมูลนี้หรือไม่?', text: "ลบแล้วจะไม่สามารถกู้คืนได้", icon: 'warning', showCancelButton: true,
                confirmButtonColor: '#ef4444', confirmButtonText: 'ลบเลย', cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteSalaryReview', id: id }) })
                    .then(r => r.json()).then(res => {
                        if (res.status === 'success') { Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false }); fetchSalaryData(); } 
                        else Swal.fire('ผิดพลาด', res.message, 'error');
                    });
                }
            });
        }
    </script>
</body>
</html>
