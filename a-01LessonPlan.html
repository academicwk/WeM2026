<div class="max-w-5xl mx-auto mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="text-xs font-bold text-gray-500">รายวิชา</label>
            <input type="text" id="subject" class="w-full mt-1 border-b-2 border-slate-200 focus:border-gold-500 outline-none pb-1">
        </div>
        <div>
            <label class="text-xs font-bold text-gray-500">ระดับชั้น</label>
            <input type="text" id="grade" class="w-full mt-1 border-b-2 border-slate-200 focus:border-gold-500 outline-none pb-1">
        </div>
        <div class="flex items-end">
            <button onclick="saveHeaderData()" class="w-full bg-navy-900 text-white py-2 rounded-lg font-bold hover:bg-navy-800">บันทึกข้อมูลหลัก</button>
        </div>
    </div>
</div>

<div class="space-y-6 max-w-5xl mx-auto" id="unit-cards-container">
    </div>

<div id="planModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl">
        <h3 class="text-lg font-bold mb-4" id="planModalTitle">ส่งแผนการสอน</h3>
        <input type="hidden" id="modal-unit">
        <input type="hidden" id="modal-week">
        <div class="space-y-4">
            <div>
                <label class="text-sm font-bold">ชื่อหน่วยการเรียนรู้</label>
                <input type="text" id="modal-unitname" class="w-full border p-2 rounded-lg" placeholder="ระบุชื่อหน่วย">
            </div>
            <div>
                <label class="text-sm font-bold">ชื่อเรื่อง/หัวข้อ</label>
                <input type="text" id="modal-title" class="w-full border p-2 rounded-lg" placeholder="ระบุชื่อเรื่องที่สอน">
            </div>
            <div class="border-2 border-dashed p-4 text-center cursor-pointer hover:bg-slate-50" onclick="document.getElementById('pdfUploader').click()">
                <i class="fa-solid fa-file-pdf text-3xl text-red-500"></i>
                <p class="text-sm mt-2">คลิกเพื่อเลือกไฟล์ PDF</p>
            </div>
        </div>
        <button onclick="submitPlanData()" class="w-full mt-6 bg-gold-500 py-2 rounded-lg font-bold">ยืนยันและอัปโหลด</button>
    </div>
</div>
