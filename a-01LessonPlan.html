<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนการจัดการเรียนรู้ / ประสบการณ์ | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <a href="main.html#zone-academic" class="w-10 h-10 bg-slate-100 hover:bg-navy-800 hover:text-white rounded-full flex items-center justify-center text-navy-900 transition-colors shadow-sm border border-gray-200 shrink-0" title="กลับหน้าวิชาการ">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none" id="header-title">แผนการจัดการเรียนรู้</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5" id="header-subtitle">ระบบจัดเก็บแผนการสอนและบันทึกหลังสอน</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" border="0" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto bg-slate-50 relative">
            <div class="max-w-6xl w-full mx-auto pb-10">

                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-3">
                    <div>
                        <h3 class="font-bold text-navy-900"><i class="fa-solid fa-chart-pie mr-2 text-blue-500"></i>ความคืบหน้าการส่งงาน</h3>
                        <p class="text-xs text-gray-500 mt-1" id="lesson-progress-text">0/0 ไฟล์ (0%)</p>
                    </div>
                    <div class="w-full md:w-1/2 h-3 bg-gray-100 rounded-full overflow-hidden shadow-inner">
                        <div id="lesson-progress-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <div id="primary-controls" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap gap-4 items-end mb-6">
                    <div class="flex-1 min-w-[200px]">
                        <label class="text-xs font-bold text-gray-500 block mb-1">ระบุรายวิชาที่ต้องการจัดการ</label>
                        <input type="text" id="subject-input" placeholder="เช่น คณิตศาสตร์พื้นฐาน, วิทยาศาสตร์..." class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:border-blue-500 outline-none font-bold text-navy-900">
                    </div>
                    <button onclick="fetchLessonPlanData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg transition-colors shadow-sm">
                        <i class="fa-solid fa-search mr-2"></i>ดึงข้อมูล
                    </button>
                </div>

                <div id="kg-controls" class="hidden bg-purple-50 p-4 rounded-xl shadow-sm border border-purple-200 mb-6 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-purple-800"><i class="fa-solid fa-shapes mr-2"></i>ระบบแผนการจัดประสบการณ์ (ปฐมวัย)</h3>
                        <p class="text-xs text-purple-600 mt-1">ส่งแผนการจัดประสบการณ์ 40 สัปดาห์ (สัปดาห์ละ 1 ไฟล์แผน และ 1 ไฟล์บันทึก)</p>
                    </div>
                    <button onclick="fetchLessonPlanData()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-sm text-sm">
                        <i class="fa-solid fa-rotate-right mr-2"></i>รีเฟรชข้อมูล
                    </button>
                </div>

                <div id="unit-cards-container">
                    <div class="text-center py-10 text-gray-400 font-bold bg-white rounded-xl border border-gray-200 shadow-sm">
                        <i class="fa-solid fa-book-open text-4xl mb-3"></i><br>กรุณาระบุรายวิชาเพื่อดูข้อมูล
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="planModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto pt-10 pb-10">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl relative flex flex-col my-auto">
            <div class="px-6 py-4 border-b border-gray-200 bg-navy-900 rounded-t-2xl flex justify-between items-center">
                <h3 class="text-lg font-bold text-white" id="modal-title">อัปโหลดไฟล์</h3>
                <button onclick="closePlanModal()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="p-6">
                <div class="bg-blue-50 text-blue-800 p-3 rounded-lg border border-blue-100 mb-4 font-bold text-sm text-center" id="modal-subtitle"></div>
                
                <div class="space-y-4">
                    <div id="input-unit-name-container">
                        <label class="text-sm font-bold text-gray-700 block mb-1">ชื่อหน่วยการเรียนรู้/ประสบการณ์ <span class="text-red-500">*</span></label>
                        <input type="text" id="input-unit-name" placeholder="ระบุชื่อหน่วย..." class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:border-blue-500 outline-none">
                    </div>
                    
                    <div id="input-lesson-title-container">
                        <label class="text-sm font-bold text-gray-700 block mb-1">ชื่อเรื่อง/แผน <span class="text-red-500">*</span></label>
                        <input type="text" id="input-lesson-title" placeholder="ระบุชื่อเรื่อง..." class="w-full border border-gray-300 p-2 rounded-lg text-sm focus:border-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="text-sm font-bold text-gray-700 block mb-1">ไฟล์ PDF <span class="text-red-500">*</span></label>
                        <input type="file" id="upload-file" accept="application/pdf" class="w-full border border-gray-300 p-2 rounded-lg text-sm bg-slate-50 cursor-pointer">
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-2xl flex justify-end gap-3 shrink-0">
                <button onclick="closePlanModal()" class="px-5 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-300 transition-colors text-sm">ยกเลิก</button>
                <button onclick="submitUpload()" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md transition-colors text-sm">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>อัปโหลด
                </button>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        
        let currentUser = null;
        let isKindergarten = false;
        let currentSubject = "";
        let uploadedData = {};

        let currentUploadUnit = 0;
        let currentUploadWeek = 0;
        let currentUploadType = '';

        function showLoading(text = 'กำลังโหลดข้อมูล...') {
            Swal.fire({ title: text, allowOutsideClick: false, showConfirmButton: false, didOpen: () => Swal.showLoading() });
        }

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-container').innerHTML = html;
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }

            currentUser = JSON.parse(userData);
            const nameParts = (currentUser.name || "").split(" ");
            
            document.getElementById('display-firstname').textContent = nameParts[0] || "ไม่ระบุชื่อ";
            document.getElementById('display-lastname').textContent = nameParts.slice(1).join(" ") || ""; 
            document.getElementById('display-position').textContent = currentUser.position || "-";
            document.getElementById('display-group').textContent = currentUser.group || "-";
            document.getElementById('display-room').textContent = currentUser.room || "-";

            if (currentUser.image && currentUser.image.trim() !== "") {
                document.getElementById('sidebar-user-img').src = currentUser.image;
                document.getElementById('sidebar-user-img').classList.remove('hidden');
                document.getElementById('sidebar-user-icon').classList.add('hidden');
            }

            // 🌟 ตรวจสอบระดับชั้นว่าเป็น ปฐมวัย (อ.) หรือ ประถมศึกษา (ป.)
            const userRoom = String(currentUser.room || "").trim();
            isKindergarten = userRoom.startsWith("อ.");

            if (isKindergarten) {
                document.getElementById('header-title').textContent = "แผนการจัดประสบการณ์ (ปฐมวัย)";
                document.getElementById('primary-controls').classList.add('hidden');
                document.getElementById('kg-controls').classList.remove('hidden');
                currentSubject = "แผนการจัดประสบการณ์ (ปฐมวัย)";
                fetchLessonPlanData(); // โหลดข้อมูลทันที
            } else {
                document.getElementById('header-title').textContent = "แผนการจัดการเรียนรู้";
                document.getElementById('primary-controls').classList.remove('hidden');
                document.getElementById('kg-controls').classList.add('hidden');
            }

            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
        function closeSidebarMobile() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        }
        function handleLogout() {
            localStorage.removeItem('wem_user');
            window.location.href = "index.html";
        }

        // ================= ดึงข้อมูลจากฐานข้อมูล =================
        async function fetchLessonPlanData() {
            if (!isKindergarten) {
                currentSubject = document.getElementById('subject-input').value.trim();
                if (!currentSubject) {
                    Swal.fire('แจ้งเตือน', 'กรุณาระบุชื่อรายวิชาก่อนดึงข้อมูล', 'warning');
                    return;
                }
            }

            showLoading('กำลังโหลดข้อมูล...');
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'getLessonPlans', name: currentUser.name, subject: currentSubject })
                }).then(r => r.json());
                
                if (res.status === 'success') {
                    uploadedData = {};
                    res.data.forEach(item => {
                        uploadedData[`unit_${item.unit}_week_${item.week}_plan`] = item.planUrl;
                        uploadedData[`unit_${item.unit}_week_${item.week}_record`] = item.recordUrl;
                        uploadedData[`unit_${item.unit}_week_${item.week}_unitName`] = item.unitName;
                        uploadedData[`unit_${item.unit}_week_${item.week}_title`] = item.lessonTitle;
                    });
                    renderUnitCards();
                    Swal.close();
                } else {
                    Swal.fire('ผิดพลาด', res.message, 'error');
                }
            } catch (e) {
                Swal.fire('ผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ', 'error');
            }
        }

        // ================= เรนเดอร์หน้าจอ (สร้างการ์ด) =================
        function renderUnitCards() {
            const container = document.getElementById('unit-cards-container');
            container.innerHTML = '';
            
            let totalSaved = 0;

            if (isKindergarten) {
                // 🌟 สำหรับปฐมวัย: 40 สัปดาห์ (40 หน่วย)
                const maxTarget = 80; // (แผน 40 + บันทึก 40)
                let html = '<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">';

                for (let u = 1; u <= 40; u++) {
                    let planUrl = uploadedData[`unit_${u}_week_1_plan`];
                    let recordUrl = uploadedData[`unit_${u}_week_1_record`];
                    let unitName = uploadedData[`unit_${u}_week_1_unitName`] || "";
                    
                    if (planUrl) totalSaved++;
                    if (recordUrl) totalSaved++;
                    
                    let bgBorder = (planUrl && recordUrl) ? 'border-purple-300 bg-purple-50/30' : 'border-gray-200 bg-white';

                    html += `
                        <div class="p-5 rounded-2xl shadow-sm border ${bgBorder} hover:shadow-md transition-shadow">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-100 pb-3 mb-4">
                                <h3 class="text-base font-bold text-purple-800"><i class="fa-solid fa-shapes mr-2"></i>สัปดาห์ที่ / หน่วยที่ ${u}</h3>
                                <div class="text-xs font-bold text-gray-500 mt-1 md:mt-0">${unitName ? `หน่วย: ${unitName}` : 'ยังไม่ระบุชื่อหน่วย'}</div>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <div class="flex-1">
                                    <h5 class="text-[11px] font-bold text-gray-600 mb-1 border-l-2 border-blue-500 pl-1.5">ไฟล์แผนฯ (4 แผน)</h5>
                                    ${planUrl ? 
                                        `<div class="flex gap-1"><a href="${planUrl}" target="_blank" class="flex-1 bg-blue-50 text-blue-700 py-1.5 rounded-lg text-[11px] font-bold text-center border border-blue-200 hover:bg-blue-100"><i class="fa-solid fa-file-pdf"></i> ดูแผน</a><button onclick="deletePlan(${u}, 1, 'plan')" class="bg-red-50 text-red-600 px-2.5 rounded-lg border border-red-200 hover:bg-red-100"><i class="fa-solid fa-trash"></i></button></div>` 
                                        : 
                                        `<button onclick="openPlanModal(${u}, 1, 'plan')" class="w-full bg-slate-50 text-slate-600 py-1.5 rounded-lg text-[11px] font-bold hover:bg-blue-600 hover:text-white transition-colors border border-slate-200"><i class="fa-solid fa-upload"></i> ส่งแผนฯ</button>`
                                    }
                                </div>
                                <div class="flex-1">
                                    <h5 class="text-[11px] font-bold text-gray-600 mb-1 border-l-2 border-amber-500 pl-1.5">ไฟล์บันทึกหลังสอน</h5>
                                    ${recordUrl ? 
                                        `<div class="flex gap-1"><a href="${recordUrl}" target="_blank" class="flex-1 bg-amber-50 text-amber-700 py-1.5 rounded-lg text-[11px] font-bold text-center border border-amber-200 hover:bg-amber-100"><i class="fa-solid fa-file-pdf"></i> ดูบันทึก</a><button onclick="deletePlan(${u}, 1, 'record')" class="bg-red-50 text-red-600 px-2.5 rounded-lg border border-red-200 hover:bg-red-100"><i class="fa-solid fa-trash"></i></button></div>` 
                                        : 
                                        `<button onclick="openPlanModal(${u}, 1, 'record')" class="w-full bg-slate-50 text-slate-600 py-1.5 rounded-lg text-[11px] font-bold hover:bg-amber-500 hover:text-white transition-colors border border-slate-200"><i class="fa-solid fa-upload"></i> ส่งบันทึกฯ</button>`
                                    }
                                </div>
                            </div>
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
                updateProgressBar(Math.round((totalSaved / maxTarget) * 100), `${totalSaved}/${maxTarget} ไฟล์`);

            } else {
                // 🌟 สำหรับประถมศึกษา: 8 หน่วย * 8 สัปดาห์
                const maxTarget = 128; // (แผน 64 + บันทึก 64)
                let html = '';

                for (let u = 1; u <= 8; u++) {
                    html += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-4">
                            <h3 class="text-lg font-bold text-navy-900 border-b pb-2 mb-4"><i class="fa-solid fa-layer-group text-blue-500 mr-2"></i>หน่วยที่ ${u}</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3">
                    `;
                    
                    for (let w = 1; w <= 8; w++) {
                        let planUrl = uploadedData[`unit_${u}_week_${w}_plan`];
                        let recordUrl = uploadedData[`unit_${u}_week_${w}_record`];
                        let unitName = uploadedData[`unit_${u}_week_${w}_unitName`] || "";
                        let lessonTitle = uploadedData[`unit_${u}_week_${w}_title`] || "";
                        
                        if (planUrl) totalSaved++;
                        if (recordUrl) totalSaved++;
                        
                        let bgClass = (planUrl && recordUrl) ? 'bg-green-50 border-green-200' : 'bg-slate-50 border-slate-200';
                        
                        html += `
                            <div class="${bgClass} border rounded-xl p-3 flex flex-col h-full hover:shadow-md transition-shadow">
                                <div class="text-[11px] font-bold text-navy-900 mb-1 text-center bg-white rounded border border-gray-100 py-1 shadow-sm">สัปดาห์ ${w}</div>
                                ${unitName ? `<div class="text-[9px] text-gray-500 truncate mb-0.5" title="${unitName}">น: ${unitName}</div>` : ''}
                                ${lessonTitle ? `<div class="text-[9px] text-gray-500 truncate mb-2" title="${lessonTitle}">ร: ${lessonTitle}</div>` : ''}
                                
                                <div class="mt-auto space-y-1.5">
                                    ${planUrl ? 
                                        `<div class="flex gap-1"><a href="${planUrl}" target="_blank" class="flex-1 bg-blue-100 text-blue-700 py-1.5 rounded text-[9px] font-bold text-center hover:bg-blue-200"><i class="fa-solid fa-file-pdf"></i> แผนฯ</a><button onclick="deletePlan(${u}, ${w}, 'plan')" class="bg-red-100 text-red-600 px-2 rounded hover:bg-red-200"><i class="fa-solid fa-trash"></i></button></div>` 
                                        : 
                                        `<button onclick="openPlanModal(${u}, ${w}, 'plan')" class="w-full bg-white border border-gray-300 text-gray-600 py-1.5 rounded text-[9px] font-bold hover:bg-blue-600 hover:text-white transition-colors"><i class="fa-solid fa-upload"></i> แผนฯ</button>`
                                    }
                                    ${recordUrl ? 
                                        `<div class="flex gap-1"><a href="${recordUrl}" target="_blank" class="flex-1 bg-amber-100 text-amber-700 py-1.5 rounded text-[9px] font-bold text-center hover:bg-amber-200"><i class="fa-solid fa-file-pdf"></i> บันทึกฯ</a><button onclick="deletePlan(${u}, ${w}, 'record')" class="bg-red-100 text-red-600 px-2 rounded hover:bg-red-200"><i class="fa-solid fa-trash"></i></button></div>` 
                                        : 
                                        `<button onclick="openPlanModal(${u}, ${w}, 'record')" class="w-full bg-white border border-gray-300 text-gray-600 py-1.5 rounded text-[9px] font-bold hover:bg-amber-500 hover:text-white transition-colors"><i class="fa-solid fa-upload"></i> บันทึกฯ</button>`
                                    }
                                </div>
                            </div>
                        `;
                    }
                    html += `</div></div>`;
                }
                container.innerHTML = html;
                updateProgressBar(Math.round((totalSaved / maxTarget) * 100), `${totalSaved}/${maxTarget} ไฟล์`);
            }
        }

        function updateProgressBar(pct, text) {
            let bar = document.getElementById('lesson-progress-bar');
            let txt = document.getElementById('lesson-progress-text');
            if (bar && txt) {
                bar.style.width = `${pct}%`;
                txt.textContent = text + ` (${pct}%)`;
                if (pct >= 100) bar.className = "h-full bg-green-500 transition-all duration-500";
                else bar.className = "h-full bg-blue-500 transition-all duration-500";
            }
        }

        // ================= จัดการ Modal อัปโหลด =================
        function openPlanModal(unit, week, type) {
            currentUploadUnit = unit;
            currentUploadWeek = week;
            currentUploadType = type;
            
            document.getElementById('modal-title').textContent = type === 'plan' ? 'อัปโหลดแผนการจัดประสบการณ์' : 'อัปโหลดบันทึกหลังสอน';
            if (!isKindergarten) {
                document.getElementById('modal-title').textContent = type === 'plan' ? 'อัปโหลดแผนการจัดการเรียนรู้' : 'อัปโหลดบันทึกหลังสอน';
            }
            
            document.getElementById('modal-subtitle').textContent = isKindergarten ? `สัปดาห์ที่ / หน่วยที่ ${unit}` : `หน่วยที่ ${unit} | สัปดาห์ที่ ${week}`;
            
            document.getElementById('upload-file').value = '';
            
            if (type === 'plan') {
                document.getElementById('input-unit-name').value = '';
                document.getElementById('input-lesson-title').value = '';
                document.getElementById('input-unit-name-container').classList.remove('hidden');
                
                if (isKindergarten) {
                    document.getElementById('input-lesson-title-container').classList.add('hidden'); // อนุบาลไม่ต้องระบุชื่อเรื่อง
                } else {
                    document.getElementById('input-lesson-title-container').classList.remove('hidden');
                }
            } else {
                document.getElementById('input-unit-name-container').classList.add('hidden');
                document.getElementById('input-lesson-title-container').classList.add('hidden');
            }
            
            document.getElementById('planModal').classList.remove('hidden');
        }
        
        function closePlanModal() {
            document.getElementById('planModal').classList.add('hidden');
        }

        function submitUpload() {
            const fileInput = document.getElementById('upload-file');
            if (!fileInput.files.length) {
                Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์ PDF ที่ต้องการอัปโหลด', 'warning');
                return;
            }

            const file = fileInput.files[0];
            let unitName = "";
            let lessonTitle = "";

            if (currentUploadType === 'plan') {
                unitName = document.getElementById('input-unit-name').value.trim();
                
                if (isKindergarten) {
                    if (!unitName) {
                        Swal.fire('แจ้งเตือน', 'กรุณาระบุชื่อหน่วยการเรียนรู้', 'warning');
                        return;
                    }
                } else {
                    lessonTitle = document.getElementById('input-lesson-title').value.trim();
                    if (!unitName || !lessonTitle) {
                        Swal.fire('แจ้งเตือน', 'กรุณาระบุชื่อหน่วยและชื่อเรื่อง/แผน', 'warning');
                        return;
                    }
                }
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                
                Swal.fire({ title: 'กำลังอัปโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'uploadLessonPlan',
                        name: currentUser.name,
                        subject: currentSubject,
                        grade: currentUser.room, // ส่งชั้นเรียนไปให้ระบบหลังบ้านรับรู้
                        unit: currentUploadUnit, 
                        week: currentUploadWeek, 
                        fileType: currentUploadType,
                        base64: base64, 
                        filename: file.name,
                        unitName: unitName, 
                        lessonTitle: lessonTitle
                    })
                }).then(r => r.json()).then(res => {
                    if (res.status === 'success') {
                        Swal.fire({ icon: 'success', title: 'อัปโหลดสำเร็จ', timer: 1500, showConfirmButton: false });
                        closePlanModal();
                        
                        uploadedData[`unit_${currentUploadUnit}_week_${currentUploadWeek}_${currentUploadType}`] = res.fileUrl;
                        if(currentUploadType === 'plan') {
                            uploadedData[`unit_${currentUploadUnit}_week_${currentUploadWeek}_unitName`] = unitName;
                            if (!isKindergarten) uploadedData[`unit_${currentUploadUnit}_week_${currentUploadWeek}_title`] = lessonTitle;
                        }
                        renderUnitCards();
                    } else Swal.fire('ผิดพลาด', res.message, 'error');
                }).catch(e => Swal.fire('ผิดพลาด', 'อัปโหลดไม่สำเร็จ', 'error'));
            };
            reader.readAsDataURL(file);
        }

        function deletePlan(unit, week, type) {
            Swal.fire({
                title: 'ยืนยันการลบไฟล์?',
                text: "หากลบแล้วจะไม่สามารถกู้คืนได้!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'กำลังลบไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'deleteLessonPlan',
                            name: currentUser.name,
                            subject: currentSubject,
                            unit: unit,
                            week: week,
                            fileType: type
                        })
                    }).then(r => r.json()).then(res => {
                        if (res.status === 'success') {
                            Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1500, showConfirmButton: false });
                            uploadedData[`unit_${unit}_week_${week}_${type}`] = null;
                            renderUnitCards();
                        } else Swal.fire('ผิดพลาด', res.message, 'error');
                    }).catch(e => Swal.fire('ผิดพลาด', 'ลบไม่สำเร็จ', 'error'));
                }
            });
        }
    </script>
</body>
</html>
