<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานการเยี่ยมบ้านนักเรียน | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <!-- แถบเมนูด้านข้าง (Sidebar) -->
    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <!-- แถบด้านบน (Header) -->
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <a href="main.html#zone-personnel" class="w-10 h-10 bg-slate-100 hover:bg-navy-800 hover:text-white rounded-full flex items-center justify-center text-navy-900 transition-colors shadow-sm border border-gray-200 shrink-0" title="กลับหน้าหลัก">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none">รายงานการเยี่ยมบ้านนักเรียน</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5" id="header-subtitle">ระบบบริหารงานบุคคล (Personnel)</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" border="0" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <!-- พื้นที่แสดงเนื้อหาหลัก -->
        <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-50 relative">
            <div class="max-w-5xl mx-auto pb-10">
                
                <!-- หัวข้อและการสรุปข้อมูล -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl shadow-inner">
                            <i class="fa-solid fa-house-user"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-navy-900 text-lg">รายการเยี่ยมบ้านของฉัน</h3>
                            <p class="text-sm text-gray-500" id="teacher-name-display">กำลังโหลดข้อมูล...</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-100 text-center w-full md:w-auto">
                        <span class="text-xs font-bold text-gray-500 block mb-1">เยี่ยมบ้านแล้วทั้งหมด</span>
                        <span class="text-2xl font-black text-blue-600" id="total-visits">0</span> <span class="text-sm font-bold text-gray-600">คน</span>
                    </div>
                </div>

                <!-- คอนเทนเนอร์แสดงผลการ์ด -->
                <div id="cards-container" class="flex flex-col gap-3">
                    <div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500 mb-3"></i><p class="text-gray-500 font-bold">กำลังดึงข้อมูล...</p></div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
            applyMenuStates();
            fetchSiteVisitData();
        });

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-container').innerHTML = html;
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userData);
            
            document.getElementById('teacher-name-display').textContent = `ครูผู้เยี่ยม: ${currentUser.name}`;

            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        function applyMenuStates() {
            const savedSettings = JSON.parse(localStorage.getItem('wem_sys_settings')) || {};
            const versionDisplay = document.getElementById('sidebar-version-display');
            if(versionDisplay) versionDisplay.textContent = `WeM System Version ${savedSettings['sys_version'] || '2.0.1'}`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if(sidebar) sidebar.classList.toggle('-translate-x-full');
            if(overlay) overlay.classList.toggle('hidden');
        }

        async function fetchSiteVisitData() {
            const container = document.getElementById('cards-container');
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST', 
                    body: JSON.stringify({ action: 'getSiteVisitData', teacherName: currentUser.name })
                }).then(r => r.json());

                if (res.status === 'success') {
                    renderCards(res.data);
                } else {
                    container.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-xl text-center border border-red-200 font-bold"><i class="fa-solid fa-circle-exclamation text-2xl mb-2"></i><br>เกิดข้อผิดพลาด: ${res.message}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-xl text-center border border-red-200 font-bold"><i class="fa-solid fa-wifi text-2xl mb-2"></i><br>ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</div>`;
            }
        }

        function renderCards(data) {
            const container = document.getElementById('cards-container');
            document.getElementById('total-visits').textContent = data.length;
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center shadow-sm">
                        <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-3"></i>
                        <h4 class="text-lg font-bold text-navy-900">ยังไม่มีข้อมูลการเยี่ยมบ้าน</h4>
                        <p class="text-sm text-gray-500 mt-1">ไม่พบรายชื่อนักเรียนที่คุณรับผิดชอบในการเยี่ยมบ้าน</p>
                    </div>`;
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                // โครงสร้างการ์ดแนวยาว (Row direction บนจอใหญ่, Column บนจอมือถือ)
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col sm:flex-row items-center sm:justify-between gap-4 hover:shadow-md transition-all relative overflow-hidden";
                
                // ปุ่ม PDF สีแดง
                const pdfButton = item.pdfUrl 
                    ? `<a href="${item.pdfUrl}" target="_blank" class="w-full sm:w-auto px-5 py-2.5 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-xl border border-red-200 hover:border-red-600 shadow-sm flex items-center justify-center gap-2 font-bold transition-colors text-sm"><i class="fa-solid fa-file-pdf text-lg"></i> เปิดดูเอกสาร</a>`
                    : `<button disabled class="w-full sm:w-auto px-5 py-2.5 bg-gray-100 text-gray-400 rounded-xl border border-gray-200 flex items-center justify-center gap-2 font-bold cursor-not-allowed text-sm"><i class="fa-solid fa-file-excel text-lg"></i> ไม่มีไฟล์</button>`;

                // จัดการรูปแบบการเยี่ยมบ้านให้อ่านง่าย
                let formatBadgeColor = item.visitFormat.includes('ออนไลน์') ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-green-50 text-green-700 border-green-200';

                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500"></div>
                    
                    <div class="flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-left gap-4 w-full pl-2">
                        <!-- ไอคอนนักเรียน -->
                        <div class="w-14 h-14 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center text-2xl shrink-0 border border-slate-200 shadow-inner">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        
                        <!-- ข้อมูลนักเรียน -->
                        <div class="flex-1">
                            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 mb-1">
                                <span class="px-2 py-0.5 bg-slate-100 text-gray-600 text-[10px] font-bold rounded border shadow-sm">รหัส: ${item.studentId || '-'}</span>
                            </div>
                            <h3 class="text-lg sm:text-xl font-bold text-navy-900 leading-tight mb-2">${item.prefix || ''}${item.firstName || ''} ${item.lastName || ''}</h3>
                            <div class="inline-flex items-center px-3 py-1 ${formatBadgeColor} text-xs font-bold rounded-lg border shadow-sm">
                                <i class="fa-solid fa-handshake-angle mr-1.5"></i> รูปแบบ: ${item.visitFormat || 'ไม่ระบุ'}
                            </div>
                        </div>
                    </div>

                    <!-- ส่วนปุ่มกด PDF -->
                    <div class="shrink-0 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100">
                        ${pdfButton}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
