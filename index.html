<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | WeM System</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: {
                        navy: { 800: '#1e3a8a', 900: '#0f172a' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-navy-900 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div id="loginCard" class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden hidden">
        <div class="bg-white text-center py-4 px-4">
            <div class="mx-auto mb-2 flex justify-center">
                <img src="https://img1.pic.in.th/images/WeM.png" alt="WeM" border="0" class="h-48 w-auto object-contain">
            </div>
        </div>
        
        <div class="p-8">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-2">
                    <label class="block text-gray-700 text-sm font-semibold mb-2" for="username">
                        ชื่อผู้ใช้งาน
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <input class="appearance-none border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-navy-800 focus:border-transparent transition-all" id="username" type="text" placeholder="Username" required>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-semibold mb-2" for="password">
                        รหัสผ่าน
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input class="appearance-none border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-navy-800 focus:border-transparent transition-all" id="password" type="password" placeholder="Password" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gold-500 hover:bg-gold-400 text-navy-900 font-bold py-3 px-4 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
                </button>

                <div class="text-center mt-4">
                    <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="4" border="0" class="h-12 w-auto mx-auto mb-2 object-contain">
                        <div class="text-red-800 text-xs font-bold leading-relaxed">
                            นวัตกรรมด้านการบริหารและบริการทางการศึกษา<br>
                            ได้รับการรับรองให้เป็นการปฏิบัติที่เป็นเลิศของสถานศึกษา (Best Practice)<br>
                            ระดับดีเยี่ยม จากเทศบาลนครระยอง ปีการศึกษา 2568
                        </div>
                </div>
                
            </form>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";

        // ตรวจสอบเมื่อโหลดหน้าเว็บ
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem('wem_user');
            
            // ถ้าเคยล็อกอินไว้แล้ว ให้ข้ามไปหน้า main เลย
            if (savedUser) {
                window.location.href = "main.html";
            } else {
                // ถ้ายังไม่เคยล็อกอิน ให้แสดงแบบฟอร์ม
                document.getElementById('loginCard').classList.remove('hidden');
            }
        });

        function showLoading(text) {
            Swal.fire({
                title: text,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            showLoading("กำลังตรวจสอบข้อมูล...");

            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        username: user,
                        password: pass
                    })
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'เข้าสู่ระบบสำเร็จ',
                        showConfirmButton: false,
                        timer: 1500
                    }).then(() => {
                        // บันทึกข้อมูลลง LocalStorage 
                        localStorage.setItem('wem_user', JSON.stringify(result.userData));
                        window.location.href = "main.html";
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'เข้าสู่ระบบไม่สำเร็จ',
                        text: result.message,
                        confirmButtonColor: '#1e3a8a'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้',
                    confirmButtonColor: '#1e3a8a'
                });
            }
        }
    </script>
<script>
        // ใส่ API ของคุณครูตรงนี้ให้ตรงกัน
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        
        document.addEventListener("DOMContentLoaded", () => {
            // ดึงค่าพื้นหลังจากเครื่องก่อนเพื่อความรวดเร็ว
            const savedSettings = JSON.parse(localStorage.getItem('wem_sys_settings')) || {};
            if(savedSettings['login_bg']) {
                document.body.style.backgroundImage = `url('${savedSettings['login_bg']}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
            }

            // โหลดเช็คการอัปเดตจากฐานข้อมูลใหม่ทุกครั้ง
            fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getSettings' }) })
            .then(r => r.json())
            .then(res => {
                if(res.status === 'success' && res.settings) {
                    localStorage.setItem('wem_sys_settings', JSON.stringify(res.settings));
                    if(res.settings['login_bg'] && res.settings['login_bg'] !== savedSettings['login_bg']) {
                        document.body.style.backgroundImage = `url('${res.settings['login_bg']}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                    }
                }
            });
        });
    </script>
    
</body>
</html>
