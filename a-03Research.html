<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิจัยเชิงปฏิบัติการในชั้นเรียน | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <a href="main.html#zone-academic" class="w-10 h-10 bg-slate-100 hover:bg-navy-800 hover:text-white rounded-full flex items-center justify-center text-navy-900 transition-colors shadow-sm border border-gray-200 shrink-0" title="กลับหน้าวิชาการ">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none">วิจัยเชิงปฏิบัติการในชั้นเรียน</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5" id="header-subtitle">ระบบจัดเก็บและรายงานผลการวิจัยในชั้นเรียน</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" border="0" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto bg-slate-50 relative">
            
            <div class="max-w-4xl mx-auto bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-navy-900 text-base"><i class="fa-solid fa-chart-pie text-gold-500 mr-2"></i>ความก้าวหน้าการส่งงานวิจัย (ปีการศึกษา <span id="display-current-year">2569</span>)</h3>
                    <span id="overall-text" class="text-sm font-bold text-gray-600">0/2 เรื่อง (0%)</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden shadow-inner">
                    <div id="overall-bar" class="h-full bg-red-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="max-w-4xl mx-auto mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex gap-2 w-full sm:w-auto">
                    <a href="https://docs.google.com/uc?export=download&id=1c0haJ53gpgt4iXxe7AO8LvpCuJpyKqe-" target="_blank" class="flex-1 sm:flex-none bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-2 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-file-word text-blue-600"></i><span class="text-sm font-bold">แบบฟอร์มรายงานวิจัย</span>
                    </a>
                </div>
                <button onclick="openResearchModal()" class="w-full sm:w-auto bg-navy-900 hover:bg-navy-800 text-white py-2 px-6 rounded-xl font-bold shadow-md transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> เพิ่มรายงานการวิจัย
                </button>
            </div>

            <div id="research-cards-container" class="max-w-4xl mx-auto space-y-3 pb-10">
                </div>
        </div>
    </main>

    <div id="researchModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <button onclick="closeResearchModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-lg font-bold text-navy-900 mb-4 border-b pb-2"><i class="fa-solid fa-flask text-gold-500 mr-2"></i><span id="modal-title-text">เพิ่มรายงานการวิจัย</span></h3>
            
            <input type="hidden" id="modal-id">
            <input type="hidden" id="modal-existing-pdf">
            
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-bold text-gray-700 mb-1 block">ภาคเรียนที่</label>
                        <select id="modal-semester" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-navy-800 outline-none text-sm bg-white">
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-gray-700 mb-1 block">ปีการศึกษา</label>
                        <input type="number" id="modal-year" value="2569" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-navy-800 outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-sm font-bold text-gray-700 mb-1 block">ชื่อเรื่องวิจัย <span class="text-red-500">*</span></label>
                    <textarea id="modal-title" rows="2" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-navy-800 outline-none text-sm" placeholder="ระบุชื่อเรื่องการวิจัย..."></textarea>
                </div>
                
                <div class="border-2 border-dashed border-gray-300 p-6 text-center rounded-xl cursor-pointer hover:bg-slate-50 transition-colors" onclick="document.getElementById('pdfUploader').click()">
                    <i class="fa-solid fa-file-pdf text-4xl text-red-500 mb-2"></i>
                    <p class="text-sm font-bold text-gray-700" id="file-filename">คลิกเพื่อแนบไฟล์ PDF <span class="text-red-500">*</span></p>
                    <p class="text-xs text-gray-500 mt-1">รองรับเฉพาะนามสกุล .pdf (หากเป็นการแก้ไขข้อมูล ถ้าไม่เลือกไฟล์ใหม่ ระบบจะใช้ไฟล์เดิม)</p>
                </div>
            </div>
            <button onclick="submitResearchData()" class="w-full mt-6 bg-gold-500 hover:bg-gold-400 text-navy-900 py-3 rounded-lg font-bold shadow-md transition-colors flex justify-center items-center gap-2">
                <i class="fa-solid fa-save"></i> บันทึกข้อมูล
            </button>
        </div>
    </div>

    <input type="file" id="pdfUploader" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        
        let currentUser = null;
        let researchDataList = [];
        let tempBase64File = ""; 
        let defaultYear = 2569;

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-container').innerHTML = html;
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }

            currentUser = JSON.parse(userData);
            const nameParts = (currentUser.name || "").split(" ");
            
            document.getElementById('display-firstname').textContent = nameParts[0] || "ไม่ระบุชื่อ";
            document.getElementById('display-lastname').textContent = nameParts.slice(1).join(" ") || ""; 
            document.getElementById('display-position').textContent = currentUser.position || "-";
            document.getElementById('display-group').textContent = currentUser.group || "-";
            document.getElementById('display-room').textContent = currentUser.room || "-";
            document.getElementById('header-subtitle').textContent = `โครงการชุมชนแห่งการเรียนรู้ทางวิชาชีพ (PLC) โดย ${currentUser.name}`;
            if (currentUser.image && currentUser.image.trim() !== "") {
                document.getElementById('sidebar-user-img').src = currentUser.image;
                document.getElementById('sidebar-user-img').classList.remove('hidden');
                document.getElementById('sidebar-user-icon').classList.add('hidden');
            }

            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        function applyMenuStates() {
            const savedSettings = JSON.parse(localStorage.getItem('wem_sys_settings')) || {};
            const version = savedSettings['sys_version'] || '2.0.1';
            const versionDisplay = document.getElementById('sidebar-version-display');
            if(versionDisplay) versionDisplay.textContent = `WeM System Version ${version}`;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
            applyMenuStates();
            
            fetchResearchData();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
        function closeSidebarMobile() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                if(overlay) overlay.classList.add('hidden');
            }
        }
        function handleLogout() {
            localStorage.removeItem('wem_user');
            window.location.href = "index.html";
        }

        // ดึงข้อมูลวิจัย
        async function fetchResearchData() {
            const container = document.getElementById('research-cards-container');
            container.innerHTML = `<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-4xl text-navy-800"></i></div>`;
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getResearch', name: currentUser.name }) }).then(r => r.json());
                if (res.status === 'success') {
                    researchDataList = res.data || [];
                    renderResearchCards();
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-red-500">ไม่สามารถโหลดข้อมูลได้</div>`;
                }
            } catch (error) { 
                container.innerHTML = `<div class="text-center py-10 text-red-500">การเชื่อมต่อผิดพลาด</div>`; 
            }
        }

        function renderResearchCards() {
            const container = document.getElementById('research-cards-container');
            container.innerHTML = '';
            
            // จัดเรียงข้อมูล: ปี ล่าสุดอยู่บน -> ภาคเรียน ล่าสุดอยู่บน -> วันที่สร้าง
            researchDataList.sort((a, b) => {
                if(b.year !== a.year) return b.year - a.year;
                if(b.semester !== a.semester) return b.semester - a.semester;
                return new Date(b.timestamp) - new Date(a.timestamp);
            });

            if (researchDataList.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 text-center">
                        <i class="fa-solid fa-flask-vial text-5xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500 font-medium">ยังไม่มีข้อมูลรายงานการวิจัย</p>
                    </div>`;
            } else {
                researchDataList.forEach(item => {
                    const card = document.createElement('div');
                    // ปรับดีไซน์ให้แคบลง กระชับขึ้น
                    card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col sm:flex-row items-center gap-3 hover:shadow-md transition-shadow relative overflow-hidden";
                    // ส่งแค่ item.id ไป เพื่อป้องกันบั๊กเครื่องหมายคำพูดพัง
                    card.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500"></div>
                        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-xl shrink-0 shadow-inner ml-2">
                            <i class="fa-solid fa-flask"></i>
                        </div>
                        <div class="flex-1 text-left w-full flex items-center gap-2 overflow-hidden">
                            <span class="bg-slate-100 px-2 py-1 rounded text-[11px] font-bold text-gray-600 shrink-0 border border-slate-200">${item.semester}/${item.year}</span>
                            <h4 class="font-bold text-navy-900 text-sm md:text-base leading-tight truncate" title="${item.title}">${item.title}</h4>
                        </div>
                        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end mt-2 sm:mt-0">
                            <button onclick="openResearchModal('${item.id}')" class="w-9 h-9 bg-white hover:bg-gold-500 hover:text-navy-900 text-gray-600 border border-gray-200 rounded-lg flex items-center justify-center transition-all shadow-sm" title="แก้ไขข้อมูล">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <a href="${item.pdfUrl}" target="_blank" class="w-9 h-9 bg-green-500 hover:bg-green-600 text-white rounded-lg flex items-center justify-center shadow-md transition-colors" title="เปิดไฟล์ PDF">
                                <i class="fa-solid fa-file-pdf text-xs"></i>
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // คำนวณหลอด Progress Bar
            let completedInCurrentYear = researchDataList.filter(item => parseInt(item.year) === defaultYear).length;
            if (completedInCurrentYear > 2) completedInCurrentYear = 2; 
            
            const pct = Math.round((completedInCurrentYear / 2) * 100);
            const barColor = pct === 100 ? 'bg-green-500' : (pct > 0 ? 'bg-blue-500' : 'bg-red-500');
            
            document.getElementById('display-current-year').textContent = defaultYear;
            document.getElementById('overall-text').textContent = `${completedInCurrentYear}/2 เรื่อง (${pct}%)`;
            document.getElementById('overall-bar').style.width = `${pct}%`;
            document.getElementById('overall-bar').className = `h-full transition-all duration-500 ${barColor}`;
        }

        // จัดการ Modal
        function openResearchModal(id = null) {
            tempBase64File = "";
            document.getElementById('file-filename').textContent = "คลิกเพื่อแนบไฟล์ PDF";
            document.getElementById('file-filename').classList.remove('text-green-600');

            if (id) {
                // โหมดแก้ไข: เอา ID ไปค้นหาข้อมูลที่โหลดมาเก็บไว้แล้ว (แก้ปัญหา String Error 100%)
                const data = researchDataList.find(r => String(r.id) === String(id));
                if(data) {
                    document.getElementById('modal-title-text').textContent = "แก้ไขรายงานการวิจัย";
                    document.getElementById('modal-id').value = data.id;
                    document.getElementById('modal-semester').value = data.semester;
                    document.getElementById('modal-year').value = data.year;
                    document.getElementById('modal-title').value = data.title;
                    document.getElementById('modal-existing-pdf').value = data.pdfUrl;
                }
            } else {
                // โหมดเพิ่มใหม่
                document.getElementById('modal-title-text').textContent = "เพิ่มรายงานการวิจัย";
                document.getElementById('modal-id').value = "";
                document.getElementById('modal-semester').value = "1";
                document.getElementById('modal-year').value = defaultYear;
                document.getElementById('modal-title').value = "";
                document.getElementById('modal-existing-pdf').value = "";
            }
            
            document.getElementById('researchModal').classList.remove('hidden');
        }

        function closeResearchModal() { 
            document.getElementById('researchModal').classList.add('hidden'); 
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") { Swal.fire('ผิดพลาด', 'ต้องเป็นไฟล์ PDF เท่านั้น', 'error'); return; }
            
            document.getElementById('file-filename').textContent = `เลือกแล้ว: ${file.name}`;
            document.getElementById('file-filename').classList.add('text-green-600');
            
            const reader = new FileReader();
            reader.onload = (ev) => { tempBase64File = ev.target.result; };
            reader.readAsDataURL(file);
            e.target.value = ''; 
        }

function submitResearchData() {
            const id = document.getElementById('modal-id').value;
            const semester = document.getElementById('modal-semester').value;
            const year = document.getElementById('modal-year').value;
            const title = document.getElementById('modal-title').value.trim(); 
            const existingPdf = document.getElementById('modal-existing-pdf').value;

            if (title === "") {
                Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาระบุชื่อเรื่องการวิจัย', 'warning');
                return;
            }
            if (!id && tempBase64File === "") {
                Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาแนบไฟล์รายงานการวิจัย (PDF)', 'warning');
                return;
            }

            Swal.fire({ title: 'กำลังบันทึกและอัปโหลดไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // 🌟 ตั้งชื่อไฟล์ใหม่ตามรูปแบบ: วิจัย_ภาคเรียน_ปีการศึกษา_ชื่อผู้ใช้งาน.pdf
            const customFilename = `วิจัย_${semester}_${year}_${currentUser.name}.pdf`;

            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'saveResearch',
                    name: currentUser.name,
                    id: id,
                    semester: semester,
                    year: year,
                    title: title,
                    base64: tempBase64File,
                    filename: customFilename, // ใช้งานชื่อไฟล์ที่ตั้งใหม่
                    existingPdfUrl: existingPdf
                })
            }).then(r => r.json()).then(res => {
                if (res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
                    closeResearchModal();
                    fetchResearchData(); 
                } else {
                    Swal.fire('ผิดพลาด', res.message, 'error');
                }
            }).catch(e => Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'));
        }
    </script>
</body>
</html>
