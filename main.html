            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <div class="border-l-4 border-gold-500 pl-3 py-1">

                    <p class="text-xs font-medium text-gray-500 mt-1.5">โรงเรียนเทศบาลวัดโขดทิมทาราม | กองการศึกษา เทศบาลนครระยอง</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">

        <div class="flex-1 p-6 overflow-y-auto scroll-smooth" id="scroll-container">

            <div id="zone-academic" class="mb-8 scroll-mt-6">

                    <i class="fa-solid fa-book-open text-blue-600"></i> ระบบบริหารงานวิชาการ
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <a href="a-01LessonPlan.html" id="menu-acad-1" class="group bg-white hover:bg-blue-600 rounded-lg shadow-sm hover:shadow-md border border-gray-100 hover:border-transparent py-2 px-4 flex items-center gap-3 transition-all duration-300">
                        <div class="w-8 h-8 bg-blue-50 group-hover:bg-white/20 rounded-full flex items-center justify-center shrink-0 transition-colors"><i class="fa-solid fa-chalkboard-user text-blue-600 group-hover:text-white text-sm transition-colors"></i></div>
                        <span class="text-sm font-medium text-gray-700 group-hover:text-white transition-colors">แผนการจัดการเรียนรู้/แผนการจัดประสบการณ์</span>
                    </a>
                    <a href="a-02PLC.html" id="menu-acad-2" class="group bg-white hover:bg-blue-600 rounded-lg shadow-sm hover:shadow-md border border-gray-100 hover:border-transparent py-2 px-4 flex items-center gap-3 transition-all duration-300">
                        <div class="w-8 h-8 bg-blue-50 group-hover:bg-white/20 rounded-full flex items-center justify-center shrink-0 transition-colors"><i class="fa-solid fa-people-group text-blue-600 group-hover:text-white text-sm transition-colors"></i></div>
                        <span class="text-sm font-medium text-gray-700 group-hover:text-white transition-colors">ชุมชนแห่งการเรียนรู้ทางวิชาชีพ (PLC)</span>
                    </a>
                    <a href="#" id="menu-acad-3" class="group bg-white hover:bg-blue-600 rounded-lg shadow-sm hover:shadow-md border border-gray-100 hover:border-transparent py-2 px-4 flex items-center gap-3 transition-all duration-300"><div class="w-8 h-8 bg-blue-50 group-hover:bg-white/20 rounded-full flex items-center justify-center shrink-0 transition-colors"><i class="fa-solid fa-flask text-blue-600 group-hover:text-white text-sm transition-colors"></i></div><span class="text-sm font-medium text-gray-700 group-hover:text-white transition-colors">วิจัยเชิงปฏิบัติการในชั้นเรียน</span></a>
                    <a href="#" id="menu-acad-4" class="group bg-white hover:bg-blue-600 rounded-lg shadow-sm hover:shadow-md border border-gray-100 hover:border-transparent py-2 px-4 flex items-center gap-3 transition-all duration-300"><div class="w-8 h-8 bg-blue-50 group-hover:bg-white/20 rounded-full flex items-center justify-center shrink-0 transition-colors"><i class="fa-solid fa-shapes text-blue-600 group-hover:text-white text-sm transition-colors"></i></div><span class="text-sm font-medium text-gray-700 group-hover:text-white transition-colors">สื่อการเรียนรู้</span></a>
                    <a href="#" id="menu-acad-5" class="group bg-white hover:bg-blue-600 rounded-lg shadow-sm hover:shadow-md border border-gray-100 hover:border-transparent py-2 px-4 flex items-center gap-3 transition-all duration-300"><div class="w-8 h-8 bg-blue-50 group-hover:bg-white/20 rounded-full flex items-center justify-center shrink-0 transition-colors"><i class="fa-solid fa-file-circle-question text-blue-600 group-hover:text-white text-sm transition-colors"></i></div><span class="text-sm font-medium text-gray-700 group-hover:text-white transition-colors">คลังข้อสอบ</span></a>
                </div>
            </div>

            <div id="zone-hr" class="mb-8 scroll-mt-6">
                </div>
            
        </div>
    </main>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        const DEFAULT_PROFILE_IMG = "https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png";
        let currentUser = null;

        // ฟังก์ชันโหลด Sidebar
        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-container').innerHTML = html;
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        // ฟังก์ชันตั้งค่าข้อมูลผู้ใช้
        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }

            currentUser = JSON.parse(userData);
            const fullName = currentUser.name || "";
            const nameParts = fullName.split(" ");
            
            document.getElementById('display-firstname').textContent = nameParts[0] || "ไม่ระบุชื่อ";
            document.getElementById('display-lastname').textContent = nameParts.slice(1).join(" ") || ""; 
            document.getElementById('display-position').textContent = currentUser.position || "-";
            document.getElementById('display-group').textContent = currentUser.group || "-";
            document.getElementById('display-room').textContent = currentUser.room || "-";

            const sidebarImg = document.getElementById('sidebar-user-img');
            const sidebarIcon = document.getElementById('sidebar-user-icon');
            if (currentUser.image && currentUser.image.trim() !== "") {
                sidebarImg.src = currentUser.image;
                sidebarImg.classList.remove('hidden');
                sidebarIcon.classList.add('hidden');
            }

            // ถ้าเป็น Admin ให้เปิดปุ่มตั้งค่า
            if (fullName === "นายพีระศิน ไชยศร") {
                document.getElementById('btn-settings').classList.replace('hidden', 'flex');
                document.getElementById('btn-user-settings').classList.replace('hidden', 'flex');
            }

            // ตั้งเวลานาฬิกา
            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent(); // รอโหลด Sidebar เสร็จก่อน
            setupUserData(); // นำข้อมูลมาใส่ Sidebar
            fetchSettingsFromDatabase(); // รันฟังก์ชันอื่นๆ ต่อ...
            applyMenuStates();
        });

        // ----------------------------------------------------
        // ฟังก์ชันควบคุม Sidebar
        // ----------------------------------------------------
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
        function closeSidebarMobile() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        }
        function handleLogout() {
            localStorage.removeItem('wem_user');
            window.location.href = "index.html";
        }

        // (ใส่ฟังก์ชันอื่นๆ ของหน้า Main.html เดิมของคุณครูไว้ใต้บรรทัดนี้ได้เลยครับ เช่น openSettingsModal, uploadImage ToGas ฯลฯ)
        // ...
    </script>
</body>
</html>
