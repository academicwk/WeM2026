<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบงานคลังข้อสอบ | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- ไลบรารีสำหรับนับหน้า PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <a href="main.html#zone-academic" class="w-10 h-10 bg-slate-100 hover:bg-navy-800 hover:text-white rounded-full flex items-center justify-center text-navy-900 transition-colors shadow-sm border border-gray-200 shrink-0">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none">ระบบงานคลังข้อสอบ</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5">ระบบบริหารงานวิชาการ</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" border="0" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="flex-1 p-6 overflow-y-auto bg-slate-50 relative">
            
            <!-- ส่วนที่ 1: แบบฟอร์มจัดทำต้นฉบับข้อสอบ -->
            <div class="max-w-6xl mx-auto mb-8">
                <h3 class="text-lg font-bold text-navy-900 mb-3 border-b-2 border-gold-400 pb-1 inline-block">1. แบบฟอร์มจัดทำต้นฉบับข้อสอบ</h3>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                    <a href="#" target="_blank" class="bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-4 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-file-word text-3xl text-blue-500"></i>
                        <span class="text-xs font-bold text-center leading-tight">แบบฟอร์ม 1<br>เลือกตอบและเขียนตอบ</span>
                    </a>
                    <a href="#" target="_blank" class="bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-4 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-file-word text-3xl text-blue-500"></i>
                        <span class="text-xs font-bold text-center leading-tight">แบบฟอร์ม 2<br>ข้อสอบเขียนตอบ</span>
                    </a>
                    <a href="#" target="_blank" class="bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-4 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-file-word text-3xl text-blue-500"></i>
                        <span class="text-xs font-bold text-center leading-tight">แบบฟอร์ม 3<br>การประเมินทักษะปฏิบัติ</span>
                    </a>
                    <a href="#" target="_blank" class="bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-4 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-file-word text-3xl text-blue-500"></i>
                        <span class="text-xs font-bold text-center leading-tight">แบบฟอร์ม 4<br>การสอบปากเปล่า</span>
                    </a>
                    <a href="#" target="_blank" class="bg-white border border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-blue-700 py-4 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-file-word text-3xl text-blue-500"></i>
                        <span class="text-xs font-bold text-center leading-tight">แบบฟอร์ม 5<br>ปฐมวัย</span>
                    </a>
                </div>
            </div>

            <!-- ส่วนที่ 2: การส่งต้นฉบับข้อสอบ -->
            <div class="max-w-6xl mx-auto">
                <div class="flex items-center mb-4">
                    <h3 class="text-lg font-bold text-navy-900 border-b-2 border-gold-400 pb-1 inline-block">2. การส่งต้นฉบับข้อสอบ</h3>
                </div>

                <div id="exam-cards-container" class="space-y-4 pb-10">
                    <div class="text-center py-10 text-gray-500 font-bold bg-white rounded-xl border"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><br>กำลังโหลดข้อมูล...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- input upload file ซ่อนไว้ -->
    <input type="file" id="examPdfUploader" accept="application/pdf" class="hidden" onchange="handleExamFileUpload(event)">

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        let currentUser = null;
        let testBankData = [];
        let uploadExamId = null;

        // รายชื่อกรรมการกลั่นกรองและชั้นที่รับผิดชอบ
        const REVIEWERS = {
            "นางสาววรากรณ์ ศรีสุธรรม": ["ป.1", "ป.2"],
            "นายพีระศิน ไชยศร": ["ป.3", "ป.4"],
            "นางสุรินรัตน์ พรมราช": ["ป.5", "ป.6"],
            "นางสาวศศิธร พรหมประเสริฐ": ["อ.1", "อ.2", "อ.3"]
        };

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
            fetchTestBankData();
        });

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                document.getElementById('sidebar-container').innerHTML = await response.text();
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userData);

            const nameParts = (currentUser.name || "").split(" ");
            document.getElementById('display-firstname').textContent = nameParts[0] || "ไม่ระบุชื่อ";
            document.getElementById('display-lastname').textContent = nameParts.slice(1).join(" ") || ""; 
            document.getElementById('display-position').textContent = currentUser.position || "-";
            document.getElementById('display-group').textContent = currentUser.group || "-";
            document.getElementById('display-room').textContent = currentUser.room || "-";

            if (currentUser.image && currentUser.image.trim() !== "") {
                document.getElementById('sidebar-user-img').src = currentUser.image;
                document.getElementById('sidebar-user-img').classList.remove('hidden');
                document.getElementById('sidebar-user-icon').classList.add('hidden');
            }

            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }
        function closeSidebarMobile() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        }
        function handleLogout() { localStorage.removeItem('wem_user'); window.location.href = "index.html"; }

        // ================= ฟังก์ชันหลักของคลังข้อสอบ =================
        async function fetchTestBankData() {
            const container = document.getElementById('exam-cards-container');
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'getTestBank' }) }).then(r => r.json());
                if (res.status === 'success') {
                    testBankData = res.data;
                    renderExamCards();
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-red-500 font-bold">ไม่สามารถโหลดข้อมูลได้: ${res.message}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="text-center py-10 text-red-500 font-bold">การเชื่อมต่อผิดพลาด</div>`;
            }
        }

        function renderExamCards() {
            const container = document.getElementById('exam-cards-container');
            container.innerHTML = '';

            // ตรวจสอบสิทธิ์การกลั่นกรอง
            const myReviewGrades = REVIEWERS[currentUser.name] || [];

            // กรองรายการที่จะแสดง (เป็นเจ้าของข้อสอบ หรือ เป็นกรรมการของชั้นนั้น)
            const visibleData = testBankData.filter(d => d.teacherName === currentUser.name || myReviewGrades.includes(d.grade));

            if (visibleData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400 font-bold bg-white rounded-xl border shadow-sm">ไม่มีรายการวิชาที่คุณรับผิดชอบในระบบ</div>`;
                return;
            }

            visibleData.forEach(item => {
                const isMyExam = item.teacherName === currentUser.name;
                const canReview = myReviewGrades.includes(item.grade);

                let statusBadge = '';
                let statusColor = '';
                if (!item.pdfUrl) { statusBadge = 'รอส่งไฟล์'; statusColor = 'bg-gray-100 text-gray-600 border-gray-200'; }
                else if (item.reviewStatus === 'กำลังกลั่นกรอง') { statusBadge = 'กำลังกลั่นกรอง'; statusColor = 'bg-amber-100 text-amber-700 border-amber-300'; }
                else if (item.reviewStatus === 'อนุมัติ') { statusBadge = 'อนุมัติ'; statusColor = 'bg-green-100 text-green-700 border-green-300'; }
                else if (item.reviewStatus === 'ปรับปรุง') { statusBadge = 'ปรับปรุง'; statusColor = 'bg-red-100 text-red-700 border-red-300'; }
                else { statusBadge = item.reviewStatus || 'กำลังกลั่นกรอง'; statusColor = 'bg-amber-100 text-amber-700 border-amber-300'; }

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-5 hover:shadow-md transition-shadow relative overflow-hidden";
                
                let reviewBoxHtml = '';
                if (canReview) {
                    reviewBoxHtml = `
                        <div id="review-box-${item.id}" class="hidden w-full mt-5 p-5 bg-indigo-50 border border-indigo-100 rounded-xl shadow-inner">
                            <label class="text-sm font-bold text-indigo-900 mb-2 block"><i class="fa-solid fa-comment-dots mr-2"></i>ความคิดเห็นจากกรรมการ</label>
                            <textarea id="comment-${item.id}" rows="5" class="w-full border border-indigo-200 p-3 rounded-xl text-sm mb-4 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all shadow-sm" placeholder="ระบุความคิดเห็นที่นี่...">${item.reviewComment || ''}</textarea>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <button onclick="submitReview('${item.id}', 'กำลังกลั่นกรอง')" class="flex-1 py-2.5 text-sm font-bold rounded-xl border-2 border-amber-400 text-amber-700 bg-white hover:bg-amber-50 transition-colors shadow-sm"><i class="fa-solid fa-magnifying-glass mr-2"></i>กำลังกลั่นกรอง</button>
                                <button onclick="submitReview('${item.id}', 'อนุมัติ')" class="flex-1 py-2.5 text-sm font-bold rounded-xl border-2 border-green-500 text-green-700 bg-white hover:bg-green-50 transition-colors shadow-sm"><i class="fa-solid fa-check mr-2"></i>อนุมัติ</button>
                                <button onclick="submitReview('${item.id}', 'ปรับปรุง')" class="flex-1 py-2.5 text-sm font-bold rounded-xl border-2 border-red-400 text-red-600 bg-white hover:bg-red-50 transition-colors shadow-sm"><i class="fa-solid fa-rotate-right mr-2"></i>ปรับปรุง</button>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${item.reviewStatus === 'อนุมัติ' ? 'bg-green-500' : 'bg-blue-500'}"></div>
                    <div class="flex-1 w-full pl-3">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-md border border-blue-200 shadow-sm">${item.subjectCode}</span>
                            <span class="px-2.5 py-1 bg-purple-50 text-purple-700 text-xs font-bold rounded-md border border-purple-200 shadow-sm">${item.grade}</span>
                            <span class="px-2.5 py-1 ${statusColor} text-xs font-bold rounded-md border shadow-sm">${statusBadge}</span>
                        </div>
                        <h4 class="font-bold text-navy-900 text-xl leading-tight mb-2">${item.subjectName}</h4>
                        <div class="space-y-1">
                            <p class="text-sm text-gray-600"><span class="font-bold text-gray-500">ประเภท:</span> ${item.examType}</p>
                            <p class="text-sm text-gray-600"><span class="font-bold text-gray-500">รูปแบบ:</span> ${item.examFormat} (${item.questionCount} ข้อ)</p>
                            <p class="text-sm text-navy-900 font-bold mt-1"><i class="fa-solid fa-chalkboard-user mr-1.5 text-gold-500"></i>ครูผู้สอน: ${item.teacherName}</p>
                        </div>
                        ${item.reviewComment ? `<div class="mt-3 bg-red-50 p-3 rounded-lg border border-red-100"><p class="text-sm text-red-700 font-bold"><i class="fa-solid fa-comment-dots mr-1.5 text-red-500"></i>กรรมการ:</p><p class="text-sm text-red-600 mt-1 whitespace-pre-wrap">${item.reviewComment}</p></div>` : ''}
                    </div>
                    
                    <div class="flex flex-col gap-3 shrink-0 w-full md:w-auto mt-4 md:mt-0">
                        <div class="flex items-center justify-between md:justify-end gap-3 text-sm font-bold text-gray-600 bg-gray-50 px-4 py-2.5 rounded-xl border border-gray-200 shadow-sm">
                            <span><i class="fa-solid fa-file-pdf text-red-500 mr-2 text-lg"></i>จำนวนหน้า:</span>
                            <span class="text-navy-900 text-lg">${item.pageCount ? item.pageCount : '-'}</span>
                        </div>
                        
                        <div class="flex gap-2">
                            ${isMyExam ? `
                                <button onclick="triggerUploadExam('${item.id}')" class="flex-1 md:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm font-bold flex items-center justify-center transition-colors text-sm" title="อัปโหลดไฟล์ (PDF เท่านั้น)"><i class="fa-solid fa-upload mr-2"></i>อัปโหลดข้อสอบ</button>
                            ` : ''}
                            
                            ${item.pdfUrl ? `<a href="${item.pdfUrl}" target="_blank" class="w-11 h-11 bg-green-500 hover:bg-green-600 text-white rounded-xl shadow-sm flex items-center justify-center transition-colors shrink-0" title="ดูไฟล์ข้อสอบ"><i class="fa-solid fa-eye text-lg"></i></a>` : ''}
                            
                            ${canReview ? `
                                <button onclick="toggleReviewBox('${item.id}')" class="flex-1 md:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm font-bold flex items-center justify-center transition-colors text-sm"><i class="fa-solid fa-list-check mr-2"></i>กลั่นกรอง</button>
                            ` : ''}
                        </div>
                    </div>
                    ${reviewBoxHtml}
                `;
                container.appendChild(card);
            });
        }

        // --- ส่วนจัดการ Upload และ นับหน้า PDF ---
        function triggerUploadExam(id) {
            uploadExamId = id;
            document.getElementById('examPdfUploader').click();
        }

        async function handleExamFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== "application/pdf") { Swal.fire('ผิดพลาด', 'ต้องเป็นไฟล์ PDF เท่านั้น', 'error'); return; }

            Swal.fire({ title: 'กำลังประมวลผลไฟล์...', text: 'กำลังนับหน้าและเตรียมอัปโหลด', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // ใช้ pdf-lib นับจำนวนหน้า
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pageCount = pdfDoc.getPageCount();

                const reader = new FileReader();
                reader.onload = (ev) => {
                    let b64 = ev.target.result;
                    b64 = b64.includes(',') ? b64.split(',')[1] : b64;
                    const cleanBase64 = b64.replace(/\s/g, '');

                    fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'uploadTestBankFile',
                            id: uploadExamId,
                            teacherName: currentUser.name,
                            base64: cleanBase64,
                            filename: file.name,
                            pageCount: pageCount
                        })
                    }).then(r => r.json()).then(res => {
                        if(res.status === 'success') {
                            Swal.fire({ icon: 'success', title: 'อัปโหลดสำเร็จ', timer: 1500, showConfirmButton: false });
                            fetchTestBankData();
                        } else Swal.fire('ผิดพลาด', res.message, 'error');
                    });
                };
                reader.readAsDataURL(file);
            } catch (err) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถอ่านไฟล์ PDF เพื่อดูจำนวนหน้าได้', 'error');
            }
            e.target.value = '';
        }

        // --- ส่วนการกลั่นกรอง (กรรมการ) ---
        function toggleReviewBox(id) {
            document.getElementById('review-box-' + id).classList.toggle('hidden');
        }

        function submitReview(id, status) {
            const comment = document.getElementById('comment-' + id).value;
            Swal.fire({ title: 'กำลังบันทึกผลการกลั่นกรอง...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'reviewTestBank', id: id, reviewStatus: status, reviewComment: comment })
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
                    fetchTestBankData();
                } else Swal.fire('ผิดพลาด', res.message, 'error');
            });
        }
    </script>
</body>
</html>
