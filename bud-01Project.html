<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารโครงการ | WeM</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { navy: { 800: '#1e3a8a', 900: '#0f172a' }, gold: { 400: '#fbbf24', 500: '#f59e0b' } } } } }
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased text-gray-800 flex h-screen overflow-hidden">

    <div id="sidebar-container" class="h-full flex shrink-0"></div>

    <main class="flex-1 flex flex-col h-full relative w-full">
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0 border-b border-gray-200">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-navy-900 focus:outline-none text-2xl shrink-0"><i class="fa-solid fa-bars"></i></button>
                <a href="main.html#zone-budget" class="w-10 h-10 bg-slate-100 hover:bg-navy-800 hover:text-white rounded-full flex items-center justify-center text-navy-900 transition-colors shadow-sm border border-gray-200 shrink-0" title="กลับหน้างบประมาณ">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="border-l-4 border-gold-500 pl-3 py-1">
                    <h2 class="text-xl font-bold text-navy-900 leading-none">ระบบบริหารโครงการ</h2>
                    <p class="text-xs font-medium text-gray-500 mt-1.5">ระบบบริหารงานงบประมาณ (Budget)</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center text-lg text-green-900 font-medium gap-2 shrink-0">
                <img src="https://img2.pic.in.th/4d3a830f3eb506411.png" alt="Icon" border="0" class="h-12 w-auto object-contain">
                <span id="current-date"></span>
            </div>
        </header>

        <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-50 relative">
            <div class="max-w-5xl mx-auto pb-10">
                
                <!-- หัวข้อรายงาน -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-6 flex items-center gap-3">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-2xl shadow-inner shrink-0">
                        <i class="fa-solid fa-diagram-project"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-navy-900 text-lg">รายงานผลการดำเนินงานโครงการ ปีการศึกษา 2568</h3>
                        <p class="text-sm text-gray-500" id="teacher-name-display">กำลังโหลดข้อมูล...</p>
                    </div>
                </div>

                <!-- คอนเทนเนอร์แสดงการ์ด -->
                <div id="project-container" class="grid grid-cols-1 gap-4">
                    <div class="col-span-full text-center py-10"><i class="fa-solid fa-spinner fa-spin text-3xl text-green-600 mb-3"></i><p class="text-gray-500 font-bold">กำลังดึงข้อมูล...</p></div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzps4XSEOdv9oCOAhiC8K5DAs-p29M9KFzhHEGebcS8W7kYUxaHzoVvKt3Xg9cRXkVU/exec";
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await loadSidebarComponent();
            setupUserData();
            applyMenuStates();
            fetchProjectData();
        });

        async function loadSidebarComponent() {
            try {
                const response = await fetch('sidebar.html');
                const html = await response.text();
                document.getElementById('sidebar-container').innerHTML = html;
            } catch (error) { console.error('Error loading sidebar:', error); }
        }

        function setupUserData() {
            const userData = localStorage.getItem('wem_user');
            if (!userData) { window.location.href = "index.html"; return; }
            currentUser = JSON.parse(userData);
            
            const nameParts = (currentUser.name || "").split(" ");
            const elFName = document.getElementById('display-firstname'); if(elFName) elFName.textContent = nameParts[0] || "ไม่ระบุชื่อ";
            const elLName = document.getElementById('display-lastname'); if(elLName) elLName.textContent = nameParts.slice(1).join(" ") || ""; 
            const elPos = document.getElementById('display-position'); if(elPos) elPos.textContent = currentUser.position || "-";
            const elGroup = document.getElementById('display-group'); if(elGroup) elGroup.textContent = currentUser.group || "-";
            const elRoom = document.getElementById('display-room'); if(elRoom) elRoom.textContent = currentUser.room || "-";

            const elImg = document.getElementById('sidebar-user-img');
            const elIcon = document.getElementById('sidebar-user-icon');
            if (currentUser.image && currentUser.image.trim() !== "" && elImg && elIcon) {
                elImg.src = currentUser.image;
                elImg.classList.remove('hidden');
                elIcon.classList.add('hidden');
            }

            document.getElementById('teacher-name-display').textContent = `ผู้รับผิดชอบ: ${currentUser.name}`;

            setInterval(() => {
                const now = new Date();
                const clockElement = document.getElementById('current-date');
                if (clockElement) clockElement.textContent = `${now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} | ${now.toLocaleTimeString('th-TH')}`;
            }, 1000);
        }

        function applyMenuStates() {
            const savedSettings = JSON.parse(localStorage.getItem('wem_sys_settings')) || {};
            const versionDisplay = document.getElementById('sidebar-version-display');
            if(versionDisplay) versionDisplay.textContent = `WeM System Version ${savedSettings['sys_version'] || '2.0.1'}`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if(sidebar) sidebar.classList.toggle('-translate-x-full');
            if(overlay) overlay.classList.toggle('hidden');
        }

        function handleLogout() {
            localStorage.removeItem('wem_user');
            window.location.href = "index.html";
        }

        async function fetchProjectData() {
            const container = document.getElementById('project-container');
            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'getProjectData', teacherName: currentUser.name })
                }).then(r => r.json());

                if (res.status === 'success') {
                    renderCards(res.data);
                } else {
                    container.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-xl text-center border border-red-200 font-bold"><i class="fa-solid fa-circle-exclamation text-2xl mb-2"></i><br>เกิดข้อผิดพลาด: ${res.message}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="bg-red-50 text-red-600 p-6 rounded-xl text-center border border-red-200 font-bold"><i class="fa-solid fa-wifi text-2xl mb-2"></i><br>ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</div>`;
            }
        }

        function renderCards(data) {
            const container = document.getElementById('project-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center shadow-sm">
                        <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-3"></i>
                        <h4 class="text-lg font-bold text-navy-900">ยังไม่มีข้อมูลโครงการ</h4>
                        <p class="text-sm text-gray-500 mt-1">ไม่พบโครงการ/กิจกรรมที่คุณเป็นผู้รับผิดชอบ</p>
                    </div>`;
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5 flex flex-col sm:flex-row items-center sm:justify-between gap-4 hover:shadow-md transition-all relative overflow-hidden";
                
                const reportBtn = item.reportUrl 
                    ? `<a href="${item.reportUrl}" target="_blank" class="w-full sm:w-auto px-4 py-2 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-xl border border-blue-200 hover:border-blue-600 shadow-sm flex items-center justify-center gap-2 font-bold transition-colors text-sm"><i class="fa-solid fa-file-pdf text-lg"></i> ไฟล์รายงาน</a>`
                    : `<button disabled class="w-full sm:w-auto px-4 py-2 bg-gray-100 text-gray-400 rounded-xl border border-gray-200 flex items-center justify-center gap-2 font-bold cursor-not-allowed text-sm"><i class="fa-solid fa-file-excel text-lg"></i> ไม่มีไฟล์รายงาน</button>`;

                const evalBtn = item.evalUrl 
                    ? `<a href="${item.evalUrl}" target="_blank" class="w-full sm:w-auto px-4 py-2 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white rounded-xl border border-red-200 hover:border-red-600 shadow-sm flex items-center justify-center gap-2 font-bold transition-colors text-sm"><i class="fa-solid fa-file-pdf text-lg"></i> ผลการประเมิน</a>`
                    : `<button disabled class="w-full sm:w-auto px-4 py-2 bg-gray-100 text-gray-400 rounded-xl border border-gray-200 flex items-center justify-center gap-2 font-bold cursor-not-allowed text-sm"><i class="fa-solid fa-file-excel text-lg"></i> ไม่มีผลประเมิน</button>`;

                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-green-500"></div>
                    
                    <div class="flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-left gap-4 w-full pl-2">
                        <!-- ไอคอนโครงการ -->
                        <div class="w-14 h-14 bg-green-50 text-green-600 rounded-xl flex items-center justify-center text-2xl shrink-0 border border-green-100 shadow-inner">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                        
                        <!-- ข้อมูลโครงการ -->
                        <div class="flex-1 w-full">
                            <h3 class="text-lg sm:text-xl font-bold text-navy-900 leading-tight mb-2">${item.projectName || 'ไม่ระบุชื่อโครงการ'}</h3>
                            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                                <span class="px-2.5 py-1 bg-slate-100 text-gray-700 text-xs font-bold rounded-lg border shadow-sm flex items-center gap-1.5"><i class="fa-solid fa-users-rectangle text-slate-400"></i> ${item.group || '-'}</span>
                            </div>
                        </div>
                    </div>

                    <!-- ปุ่ม PDF ชิดขวาบนหน้าจอใหญ่ -->
                    <div class="shrink-0 w-full sm:w-auto mt-2 sm:mt-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100 flex flex-col sm:flex-row gap-2">
                        ${reportBtn}
                        ${evalBtn}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
